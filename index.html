  var params = new URLSearchParams(location.search);
  var vista = (/^\/vendedor\/?$/.test(location.pathname) || params.get('v') === 'panel') ? 'panel' : 'publica';

  var C = { valor: 50000, nombreVendedor: '', whatsappVendedor: '' };
  var valor = 50000;
  var cargado = false;
  var vendidos = new Set();
  var sel = new Set();
  var modal = null;
  var borrador = {};
  var ocupado = false;
  var mios = leerLocal(CLAVE_LOCAL, []);
  var avisoTimer = null;
  var dlg = null;

  // Panel
  var clave = '';
  var filas = [];

  /* ---------- Utilidades ---------- */
  function $(id) { return document.getElementById(id); }
  function leerLocal(k, def) {
    try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? def : v; } catch (e) { return def; }
  }
  function guardarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pesos(n) { return '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function digitos(s) { return String(s || '').replace(/\D/g, ''); }
  function ordenar(a) { return a.slice().sort(); }
  function plural(n, uno, varios) { return n === 1 ? uno : varios; }
  function waNumero(s) {
    var d = digitos(s);
    if (d.length === 10 && d.charAt(0) === '3') d = '57' + d;
    return d.length >= 10 ? d : '';
  }
  function faltan() {
    var h = new Date();
    var d = Math.round((SORTEO_UTC - Date.UTC(h.getFullYear(), h.getMonth(), h.getDate())) / 864e5);
    if (d > 1) return 'Faltan ' + d + ' días';
    if (d === 1) return 'Falta 1 día';
    if (d === 0) return 'Juega hoy';
    return 'Ya jugó';
  }
  function fechaCorta(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    try { return d.toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return d.toLocaleString(); }
  }
  function api(ruta, datos, ok, fallo) {
    var op = datos ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) } : { cache: 'no-store' };
    fetch(ruta, op)
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'Respuesta inesperada del servidor (' + r.status + ').' }; }); })
      .then(function (j) { ok && ok(j || {}); })
      .catch(function (e) { fallo && fallo(e); });
  }
  function aviso(msg) {
    var a = $('aviso');
    var destino = dlg && dlg.open ? dlg : document.body;
    if (a.parentNode !== destino) destino.appendChild(a);
    a.textContent = msg; a.hidden = false;
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function () { a.hidden = true; }, 4200);
  }
  function errorEn(id, msg) {
    var el = $(id); if (!el) return;
    el.textContent = msg || ''; el.hidden = !msg;
  }
  function copiar(texto, respaldo) {
    try { navigator.clipboard.writeText(texto).then(function () { aviso('Copiado.'); }, respaldo); }
    catch (e) { respaldo(); }
  }

  var FONDO = '<div class="fondo" aria-hidden="true"></div><div class="velo" aria-hidden="true"></div>' +
    '<div class="banda"><div class="wrap"><p>La obra del Señor continúa</p></div></div>';
  var PILDORA = '<p class="pildora"><span>Calendario Millonario 2027</span><span class="sep"> · </span><span>Parroquia Juan Pablo II</span></p>';
  var COMUNES = '<div class="barra" id="barra" hidden></div>' +
    '<dialog class="modal" id="modal" aria-labelledby="m-titulo"><div class="modal-cont" id="modal-cont"></div></dialog>' +
    '<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>';

  /* =========================================================
     PÁGINA DEL BONO
     ========================================================= */
  function htmlPublica() {
    return FONDO +
      '<figure class="afiche"><img src="/afiche.jpg" width="1170" height="578" alt="Afiche del bono donativo de la Parroquia Juan Pablo II: valor $50.000 COP o 15 USD; con tu aporte participas en el sorteo de 50 millones de pesos el 30 de diciembre de 2026 con la Lotería del Valle. Despacho parroquial +57 316 2357186."></figure>' +
      '<main class="wrap">' +
        '<section class="intro">' + PILDORA +
          '<h1>Escoge tu número</h1>' +
          '<p class="valor"><span class="monto">Valor: ' + pesos(valor) + '</span><span class="cop">cop</span><span class="usd">/ 15 USD</span></p>' +
          '<p class="juega">Juega el 30 de Diciembre de 2026 · <strong>' + faltan() + '</strong></p>' +
        '</section>' +
        '<section class="sala" aria-labelledby="t-sala">' +
          '<h2 class="conteo" id="t-sala">Cargando números…</h2>' +
          '<p class="ayuda">Toca el número que quieres, escribe tus datos y queda apartado a tu nombre. Los números en rojo ya tienen dueño.</p>' +
          '<div id="estado-error"></div>' +
          '<div class="pantalla" aria-hidden="true"><span>Sorteo de 50 millones</span></div>' +
          '<div class="butacas" id="butacas" role="group" aria-label="Números del calendario" aria-busy="true"></div>' +
          '<ul class="leyenda" id="leyenda"></ul>' +
        '</section>' +
        '<footer class="pie">' +
          '<p class="pie-et">Despacho Parroquial</p>' +
          '<p class="pie-tel tel">+57 316 2357186</p>' +
          '<p class="pie-lot">*Juega con la Lotería del Valle*</p>' +
          '<p class="pie-nota">Cada calendario trae impreso un número que participa en el sorteo de 50 millones de pesos. Bono donativo para la obra de la Parroquia Juan Pablo II.</p>' +
        '</footer>' +
      '</main>' + COMUNES;
  }

  function renderButacas() {
    var foco = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.n : null;
    var html = '';
    for (var i = 0; i < NUMEROS.length; i += POR_FILA) {
      html += '<div class="fila">';
      NUMEROS.slice(i, i + POR_FILA).forEach(function (n) {
        var vend = vendidos.has(n), s = sel.has(n), mio = vend && mios.indexOf(n) >= 0;
        var cls = 'butaca' + (vend ? ' vendida' : '') + (mio ? ' mio' : '') + (cargado ? '' : ' cargando');
        var txt = !cargado ? 'cargando' : mio ? 'apartado por ti' : vend ? 'vendido' : s ? 'en tu selección' : 'disponible';
        html += '<button type="button" class="' + cls + '" data-n="' + esc(n) + '" aria-pressed="' + (s ? 'true' : 'false') + '"' +
          (vend || !cargado ? ' aria-disabled="true"' : '') + ' aria-label="Número ' + esc(n) + ', ' + txt + '"><span class="num">' + esc(n) + '</span></button>';
      });
      html += '</div>';
    }
    $('butacas').innerHTML = html;
    $('butacas').setAttribute('aria-busy', cargado ? 'false' : 'true');
    if (foco) { var b = $('butacas').querySelector('[data-n="' + foco + '"]'); if (b) b.focus({ preventScroll: true }); }
    if (cargado) {
      var libres = NUMEROS.filter(function (n) { return !vendidos.has(n); }).length;
      $('t-sala').innerHTML = libres
        ? '<strong>' + libres + '</strong> de ' + NUMEROS.length + ' números disponibles'
        : '<strong>Todos los números están vendidos</strong>';
    }
    var hayMios = mios.some(function (n) { return vendidos.has(n); });
    $('leyenda').innerHTML =
      '<li><i class="muestra"></i>Disponible</li>' +
      '<li><i class="muestra sel"></i>Tu selección</li>' +
      '<li><i class="muestra vend"></i>Vendido</li>' +
      (hayMios ? '<li><i class="muestra mio"></i>Tus números</li>' : '');
  }

  function tocarButaca(n) {
    if (ocupado) return;
    if (!cargado) { aviso('Un momento, estamos cargando los números.'); return; }
    if (vendidos.has(n)) {
      aviso(mios.indexOf(n) >= 0 ? 'El ' + n + ' ya es tuyo.' : 'El ' + n + ' ya está vendido. Escoge otro número.');
      return;
    }
    if (sel.has(n)) { sel.delete(n); renderButacas(); renderBarra(); return; }
    sel.add(n);
    renderButacas();
    abrirModal({ tipo: 'datos' });
  }

  function renderBarra() {
    var b = $('barra');
    if (!b) return;
    var mostrar = vista === 'publica' && sel.size > 0 && !modal;
    if (mostrar) {
      var nums = ordenar(Array.from(sel));
      b.innerHTML = '<div class="barra-in">' +
        '<div class="barra-info"><div class="barra-nums">' + nums.join(' · ') + '</div>' +
        '<div class="barra-total">' + nums.length + ' ' + plural(nums.length, 'calendario', 'calendarios') + ' · ' + pesos(nums.length * valor) + '</div></div>' +
        '<div class="barra-acc"><button type="button" class="btn btn-fantasma" data-acc="limpiar">Quitar</button>' +
        '<button type="button" class="btn btn-oro" data-acc="continuar">Continuar</button></div></div>';
    }
    b.hidden = !mostrar;
    document.body.classList.toggle('con-barra', mostrar);
  }

  function aplicarEstado(res) {
    if (res.config) {
      C = res.config;
      valor = Number(C.valor) || valor;
      if (Array.isArray(C.numeros) && C.numeros.length) NUMEROS = C.numeros;
    }
    if (res.vendidos) vendidos = new Set(res.vendidos);
  }

  function cargarEstado(primeraVez) {
    if (vista !== 'publica' || ocupado || (!primeraVez && document.hidden)) return;
    api('/api/estado', null, function (res) {
      if (!res.vendidos) {
        if (primeraVez) $('estado-error').innerHTML = '<p class="alerta">' + esc(res.error || 'No se pudieron cargar los números.') + ' Recarga la página.</p>';
        return;
      }
      $('estado-error').innerHTML = '';
      var antes = vendidos;
      aplicarEstado(res);
      cargado = true;
      var perdidos = Array.from(sel).filter(function (n) { return vendidos.has(n); });
      perdidos.forEach(function (n) { sel.delete(n); });
      var cambio = primeraVez || antes.size !== vendidos.size || res.vendidos.some(function (n) { return !antes.has(n); });
      if (!cambio) return;
      renderButacas();
      if (modal && modal.tipo === 'datos') {
        if (!sel.size) { cerrarModal(false); aviso('Otra persona acaba de apartar ese número. Escoge otro.'); }
        else if (perdidos.length) { borrador = leerDatos(); $('m-resumen').innerHTML = htmlResumen(ordenar(Array.from(sel)), true); aviso('El ' + perdidos.join(', ') + ' lo acaba de apartar otra persona.'); }
      } else { renderBarra(); }
    }, function () {
      if (primeraVez) $('estado-error').innerHTML = '<p class="alerta">No se pudieron cargar los números. Revisa tu internet y recarga la página.</p>';
    });
  }

  /* ---------- Ventana modal ---------- */
  function abrirModal(m) {
    modal = m;
    renderModal();
    if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }
    document.documentElement.classList.add('modal-abierto');
    renderBarra();
    setTimeout(function () {
      var f = dlg.querySelector('input:not([type=checkbox])') || dlg.querySelector('.btn');
      if (f) f.focus();
    }, 60);
  }

  function cerrarModal(conservarSeleccion) {
    if (!conservarSeleccion) { sel.clear(); borrador = {}; }
    modal = null;
    if (dlg.open) { try { dlg.close(); } catch (e) { dlg.removeAttribute('open'); } }
    document.documentElement.classList.remove('modal-abierto');
    $('modal-cont').innerHTML = '';
    if (vista === 'publica') { renderButacas(); renderBarra(); }
  }

  function cabecera(eyebrow, titulo) {
    return '<header class="m-cab"><p class="m-eyebrow">' + eyebrow + '</p><h3 id="m-titulo">' + titulo + '</h3>' +
      '<button type="button" class="m-x" data-acc="cerrar" aria-label="Cerrar">×</button></header>';
  }

  function htmlResumen(nums, quitables) {
    return '<div class="chips">' + nums.map(function (n) {
      return quitables
        ? '<button type="button" class="chip" data-acc="quitar-num" data-num="' + esc(n) + '" aria-label="Quitar el número ' + esc(n) + '">' + esc(n) + '<span class="q" aria-hidden="true">×</span></button>'
        : '<span class="chip">' + esc(n) + '</span>';
    }).join('') + '</div>' +
      '<span class="total">' + nums.length + ' ' + plural(nums.length, 'calendario', 'calendarios') + ' · <strong>' + pesos(nums.length * valor) + '</strong></span>';
  }

  function htmlModalDatos() {
    var nums = ordenar(Array.from(sel));
    var paraOtro = vista === 'panel';
    return cabecera('Calendario Millonario 2027', paraOtro ? 'Asignar ' + plural(nums.length, 'número', 'números') : plural(nums.length, 'Aparta tu número', 'Aparta tus números')) +
      '<div class="resumen" id="m-resumen">' + htmlResumen(nums, true) + '</div>' +
      (paraOtro ? '' : '<button type="button" class="link" data-acc="otro">+ Escoger otro número</button>') +
      '<form id="f-datos" novalidate>' +
        '<label for="f-nombre">Nombre y apellido<input type="text" id="f-nombre" autocomplete="' + (paraOtro ? 'off' : 'name') + '" maxlength="80" value="' + esc(borrador.nombre) + '"></label>' +
        '<label for="f-cel">Celular o WhatsApp<input type="tel" id="f-cel" autocomplete="' + (paraOtro ? 'off' : 'tel') + '" inputmode="tel" maxlength="20" placeholder="300 123 4567" value="' + esc(borrador.celular) + '"></label>' +
        '<label for="f-nota"><span>Nota <small>(opcional)</small></span><input type="text" id="f-nota" autocomplete="off" maxlength="140" placeholder="Ej.: pago por Nequi, lo recojo el domingo" value="' + esc(borrador.nota) + '"></label>' +
        '<p class="error" id="f-error" hidden></p>' +
        '<button type="submit" class="btn btn-primario btn-ancho" id="f-enviar">' + (paraOtro ? 'Asignar' : 'Apartar ' + plural(nums.length, 'mi número', 'mis números')) + '</button>' +
      '</form>' +
      (paraOtro ? '' : '<p class="nota">Al tocar Apartar, ' + plural(nums.length, 'el número queda', 'los números quedan') + ' a tu nombre y en rojo para todos. Nadie más ve tu nombre ni tu celular.</p>');
  }

  function htmlModalListo() {
    var e = modal.datos;
    var varios = e.nums.length > 1;
    var nombreCorto = String(e.nombre || '').split(' ')[0];
    var nomV = (C.nombreVendedor || '').trim();
    var wa = waNumero(C.whatsappVendedor);
    var msg = 'Hola' + (nomV ? ' ' + nomV : '') + ', aparté ' + (varios ? 'los números ' : 'el número ') + e.nums.join(', ') +
      ' del Calendario Millonario 2027 de la Parroquia Juan Pablo II a nombre de ' + e.nombre + '. Total: ' + pesos(e.nums.length * valor) + '. ¿Cómo te pago?';
    return cabecera('Calendario Millonario 2027', '¡Listo, ' + esc(nombreCorto) + '!') +
      '<div class="exito"><div class="sello" aria-hidden="true">✓</div>' +
        '<div class="chips">' + e.nums.map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join('') + '</div>' +
        '<p>' + (varios ? 'Tus números quedaron apartados' : 'Tu número quedó apartado') + ' a tu nombre y ya ' + (varios ? 'aparecen' : 'aparece') + ' en rojo para todos.</p></div>' +
      '<div class="pagar"><span>Valor a pagar</span><strong>' + pesos(e.nums.length * valor) + '</strong></div>' +
      (wa
        ? '<p class="nota">Para coordinar el pago, escríbele a ' + (nomV ? esc(nomV) : 'quien te compartió esta página') + '.</p>' +
          '<a class="btn btn-wa btn-ancho" href="https://wa.me/' + wa + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">Avisar por WhatsApp</a>'
        : '<p class="nota">' + (nomV ? esc(nomV) : 'Quien te compartió esta página') + ' te contactará para el pago.</p>') +
      '<button type="button" class="btn btn-sec btn-ancho" data-acc="cerrar">Ver los números</button>';
  }

  function renderModal() {
    var c = $('modal-cont');
    if (!modal) { c.innerHTML = ''; return; }
    if (modal.tipo === 'datos') c.innerHTML = htmlModalDatos();
    else if (modal.tipo === 'listo') c.innerHTML = htmlModalListo();
    else if (modal.tipo === 'detalle') c.innerHTML = htmlModalDetalle(modal.n);
  }

  function leerDatos() {
    return { nombre: $('f-nombre').value.trim(), celular: $('f-cel').value.trim(), nota: $('f-nota').value.trim() };
  }

  function enviarDatos() {
    var d = leerDatos();
    if (d.nombre.length < 3) { errorEn('f-error', 'Escribe el nombre y apellido.'); $('f-nombre').focus(); return; }
    if (digitos(d.celular).length < 7) { errorEn('f-error', 'Escribe un número de celular válido.'); $('f-cel').focus(); return; }
    var nums = ordenar(Array.from(sel)).filter(function (n) { return !vendidos.has(n); });
    if (!nums.length) { cerrarModal(false); return; }
    errorEn('f-error', '');
    ocupado = true;
    var btn = $('f-enviar'); var txt = btn.textContent;
    btn.disabled = true; btn.textContent = vista === 'panel' ? 'Asignando…' : 'Apartando…';
    api('/api/apartar', { nums: nums, nombre: d.nombre, celular: d.celular, nota: d.nota }, function (res) {
      ocupado = false;
      if (res.vendidos) vendidos = new Set(res.vendidos);
      if (res.ok) {
        sel.clear(); borrador = {};
        if (vista === 'publica') {
          nums.forEach(function (n) { if (mios.indexOf(n) < 0) mios.push(n); });
          guardarLocal(CLAVE_LOCAL, mios);
          modal = { tipo: 'listo', datos: { nums: nums, nombre: d.nombre } };
          renderModal(); renderButacas();
        } else {
          cerrarModal(false);
          aviso(plural(nums.length, 'El ', 'Los ') + nums.join(', ') + plural(nums.length, ' quedó asignado.', ' quedaron asignados.'));
          cargarPanel();
        }
        return;
      }
      btn.disabled = false; btn.textContent = txt;
      borrador = d;
      if (res.tomados && res.tomados.length) {
        res.tomados.forEach(function (n) { sel.delete(n); });
        if (vista === 'publica') renderButacas();
        if (sel.size) $('m-resumen').innerHTML = htmlResumen(ordenar(Array.from(sel)), true);
        else btn.disabled = true;
      }
      errorEn('f-error', res.error || 'No se pudo apartar. Intenta de nuevo.');
    }, function () {
      ocupado = false;
      btn.disabled = false; btn.textContent = txt;
      errorEn('f-error', 'No se pudo conectar. Revisa tu internet e intenta de nuevo.');
    });
  }

  /* =========================================================
     PANEL DEL VENDEDOR (/vendedor)
     ========================================================= */
  function renderClave(msg) {
    $('vend').innerHTML =
      '<section class="v-cab">' + PILDORA +
        '<h1>Panel del vendedor</h1>' +
        '<p class="v-sub">Escribe tu clave para ver a los compradores y las cuentas.</p>' +
        '<form id="f-clave" class="clave-form" novalidate>' +
          '<label for="clave">Clave<input type="password" id="clave" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40"></label>' +
          '<p class="error" id="clave-error"' + (msg ? '' : ' hidden') + '>' + esc(msg || '') + '</p>' +
          '<button type="submit" class="btn btn-primario" id="clave-btn">Entrar</button>' +
        '</form>' +
      '</section>';
    setTimeout(function () { var i = $('clave'); if (i) i.focus(); }, 50);
  }

  function recibirPanel(res) {
    filas = res.filas || [];
    if (res.config) { C.nombreVendedor = res.config.nombreVendedor || ''; C.whatsappVendedor = res.config.whatsappVendedor || ''; }
    armarPanel(); renderPanel();
  }

  function entrar(c, silencioso) {
    clave = c;
    var btn = $('clave-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Entrando…'; }
    api('/api/panel', { clave: c, accion: 'datos' }, function (res) {
      if (res.ok) {
        try { sessionStorage.setItem('cm2027-clave', c); } catch (e) {}
        recibirPanel(res);
      } else {
        clave = '';
        try { sessionStorage.removeItem('cm2027-clave'); } catch (e) {}
        renderClave(silencioso ? '' : res.error || 'Clave incorrecta.');
      }
    }, function () { renderClave('No se pudo conectar. Revisa tu internet e intenta de nuevo.'); });
  }

  function cargarPanel() {
    if (!clave) return;
    api('/api/panel', { clave: clave, accion: 'datos' }, function (res) { if (res.ok) recibirPanel(res); });
  }

  function armarPanel() {
    if ($('v-stats')) return;
    $('vend').innerHTML =
      '<section class="v-cab">' + PILDORA +
        '<h1>Panel del vendedor</h1>' +
        '<p class="v-sub">Aquí ves quién compró cada número. Solo entra quien tenga tu clave.</p>' +
        '<div class="acciones">' +
          '<a class="btn btn-sec" href="/">← Página del bono</a>' +
          '<button type="button" class="btn btn-sec" data-acc="actualizar">Actualizar</button>' +
        '</div>' +
      '</section>' +
      '<div id="v-alerta"></div>' +
      '<section class="v-sec" aria-labelledby="v-t1"><h2 id="v-t1">Resumen</h2>' +
        '<div class="v-avance"><div class="v-avance-txt"><strong id="v-vendidos"></strong><span id="v-vendidos-txt"></span></div><div class="progreso"><i id="v-barra"></i></div></div>' +
        '<div class="stats" id="v-stats"></div>' +
      '</section>' +
      '<section class="v-sec" aria-labelledby="v-t2"><h2 id="v-t2">Números</h2>' +
        '<p class="nota">Toca un número vendido para ver sus datos, o uno libre para asignárselo a alguien.</p>' +
        '<div class="mapa" id="v-mapa"></div>' +
        '<ul class="leyenda v-ley"><li><i class="muestra lib"></i>Libre</li><li><i class="muestra pend"></i>Vendido, por cobrar</li><li><i class="muestra pag"></i>Vendido y pagado</li></ul>' +
      '</section>' +
      '<section class="v-sec" aria-labelledby="v-t3"><h2 id="v-t3">Compradores</h2>' +
        '<div id="v-tabla"></div>' +
        '<div class="acciones"><button type="button" class="btn btn-sec" data-acc="copiar-lista" id="v-copiar">Copiar lista</button></div>' +
        '<textarea class="copia" id="v-copia" readonly hidden aria-label="Lista de compradores para copiar"></textarea>' +
      '</section>' +
      '<section class="v-sec" aria-labelledby="v-t4">' +
        '<form id="f-config" novalidate>' +
          '<h2 id="v-t4">Tus datos de contacto</h2>' +
          '<p class="nota">Aparecen cuando alguien aparta un número, para que te avise por WhatsApp y coordinen el pago.</p>' +
          '<label for="c-nombre">Tu nombre<input type="text" id="c-nombre" maxlength="40" placeholder="Ej.: Javier" value="' + esc(C.nombreVendedor) + '"></label>' +
          '<label for="c-wa">Tu WhatsApp<input type="tel" id="c-wa" inputmode="tel" maxlength="20" placeholder="300 123 4567" value="' + esc(C.whatsappVendedor) + '"></label>' +
          '<p class="error" id="c-error" hidden></p>' +
          '<div class="acciones"><button type="submit" class="btn btn-primario" id="c-guardar">Guardar</button></div>' +
        '</form>' +
      '</section>' +
      '<div style="height:48px"></div>';
  }

  function stat(etq, val, sub) {
    return '<div class="stat"><span>' + etq + '</span><strong>' + val + '</strong>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>';
  }

  function filaDe(n) { return filas.filter(function (f) { return f.numero === n; })[0] || null; }

  function renderPanel() {
    if (!$('v-stats')) return;
    var vend = filas.filter(function (f) { return f.nombre; });
    var pag = vend.filter(function (f) { return f.pagado; }).length;
    var total = NUMEROS.length;
    var pct = total ? Math.round(vend.length / total * 100) : 0;
    $('v-alerta').innerHTML = waNumero(C.whatsappVendedor) ? '' :
      '<p class="alerta" style="margin-top:16px">Agrega tu WhatsApp en "Tus datos de contacto" para que los compradores puedan avisarte del pago.</p>';
    $('v-vendidos').textContent = vend.length;
    $('v-vendidos-txt').textContent = 'de ' + total + ' calendarios vendidos (' + pct + '%)';
    $('v-barra').style.width = pct + '%';
    $('v-stats').innerHTML =
      stat('Disponibles', total - vend.length) +
      stat('Pagados', pag, 'de ' + vend.length + ' vendidos') +
      stat('Recaudado', pesos(pag * valor), 'meta ' + pesos(total * valor)) +
      stat('Por cobrar', pesos((vend.length - pag) * valor));

    $('v-mapa').innerHTML = NUMEROS.map(function (n) {
      var f = filaDe(n);
      var cls = !(f && f.nombre) ? 'lib' : (f.pagado ? 'pag' : 'pend');
      var txt = cls === 'lib' ? 'Libre' : cls === 'pag' ? 'Pagado' : 'Por cobrar';
      return '<button type="button" class="mn ' + cls + '" data-acc="mapa" data-num="' + esc(n) + '" aria-label="Número ' + esc(n) + ', ' + txt.toLowerCase() + '">' + esc(n) + '<small>' + txt + '</small></button>';
    }).join('');

    if (!vend.length) {
      $('v-tabla').innerHTML = '<p class="vacio">Todavía no hay números vendidos. Cuando alguien aparte uno en la página, aparece aquí.</p>';
    } else {
      $('v-tabla').innerHTML = '<div class="tabla-wrap"><table><thead><tr><th>Número</th><th>Comprador</th><th>Celular</th><th>Pagó</th><th><span class="sr">Acción</span></th></tr></thead><tbody>' +
        vend.map(function (f) {
          return '<tr><td class="n">' + esc(f.numero) + '</td>' +
            '<td>' + esc(f.nombre) + (f.nota ? '<small>' + esc(f.nota) + '</small>' : '') + (f.fecha ? '<small>' + esc(fechaCorta(f.fecha)) + '</small>' : '') + '</td>' +
            '<td><span class="tel">' + esc(f.celular) + '</span></td>' +
            '<td><input type="checkbox" data-pagado="' + esc(f.numero) + '"' + (f.pagado ? ' checked' : '') + ' aria-label="Pagó el ' + esc(f.numero) + '"></td>' +
            '<td><button type="button" class="link" data-acc="mapa" data-num="' + esc(f.numero) + '">Ver</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    $('v-copiar').disabled = !vend.length;
    if (modal && modal.tipo === 'detalle' && !ocupado) renderModal();
  }

  function htmlModalDetalle(n) {
    var f = filaDe(n) || {};
    if (!f.nombre) {
      return cabecera('Número ' + esc(n), 'Ya está libre') + '<p>Este número ya no tiene comprador.</p>' +
        '<button type="button" class="btn btn-sec btn-ancho" data-acc="cerrar">Cerrar</button>';
    }
    var wa = waNumero(f.celular);
    return cabecera('Número vendido', 'Número ' + esc(n)) +
      '<dl class="ficha">' +
        '<dt>Comprador</dt><dd>' + esc(f.nombre) + '</dd>' +
        '<dt>Celular</dt><dd><span class="tel">' + esc(f.celular) + '</span></dd>' +
        (f.nota ? '<dt>Nota</dt><dd>' + esc(f.nota) + '</dd>' : '') +
        (f.fecha ? '<dt>Apartado</dt><dd>' + esc(fechaCorta(f.fecha)) + '</dd>' : '') +
      '</dl>' +
      (wa ? '<a class="btn btn-wa btn-ancho" href="https://wa.me/' + wa + '" target="_blank" rel="noopener">Escribirle por WhatsApp</a>' : '') +
      '<label class="check" for="d-pagado"><input type="checkbox" id="d-pagado" data-pagado="' + esc(n) + '"' + (f.pagado ? ' checked' : '') + '>Ya pagó</label>' +
      '<div class="liberar">' +
        (modal && modal.confirmar
          ? '<p>¿Liberar el ' + esc(n) + '? Volverá a aparecer disponible para todos y se borran los datos de su comprador.</p>' +
            '<div class="acciones"><button type="button" class="btn btn-peligro lleno" data-acc="liberar-si" id="d-liberar">Sí, liberar</button>' +
            '<button type="button" class="btn btn-sec" data-acc="liberar-no">Cancelar</button></div>'
          : '<button type="button" class="btn btn-peligro" data-acc="liberar">Liberar número</button>') +
      '</div>';
  }

  function cambiarPagado(n, valorPagado, input) {
    input.disabled = true;
    api('/api/panel', { clave: clave, accion: 'pagado', numero: n, pagado: valorPagado }, function (res) {
      input.disabled = false;
      if (res.ok) { recibirPanel(res); aviso(valorPagado ? 'El ' + n + ' quedó como pagado.' : 'El ' + n + ' quedó por cobrar.'); }
      else { input.checked = !valorPagado; aviso(res.error || 'No se pudo guardar.'); }
    }, function () { input.disabled = false; input.checked = !valorPagado; aviso('No se pudo conectar. Intenta de nuevo.'); });
  }

  function liberarNumero(n) {
    ocupado = true;
    var b = $('d-liberar'); if (b) { b.disabled = true; b.textContent = 'Liberando…'; }
    api('/api/panel', { clave: clave, accion: 'liberar', numero: n }, function (res) {
      ocupado = false;
      if (res.ok) { cerrarModal(false); recibirPanel(res); aviso('El ' + n + ' quedó disponible.'); }
      else { if (b) { b.disabled = false; b.textContent = 'Sí, liberar'; } aviso(res.error || 'No se pudo liberar.'); }
    }, function () { ocupado = false; if (b) { b.disabled = false; b.textContent = 'Sí, liberar'; } aviso('No se pudo conectar. Intenta de nuevo.'); });
  }

  function guardarContacto() {
    var nombre = $('c-nombre').value.trim();
    var wa = digitos($('c-wa').value);
    if (wa && !waNumero(wa)) { errorEn('c-error', 'Escribe el celular con 10 dígitos, o con el indicativo del país.'); return; }
    errorEn('c-error', '');
    var b = $('c-guardar'); b.disabled = true; b.textContent = 'Guardando…';
    api('/api/panel', { clave: clave, accion: 'config', nombreVendedor: nombre, whatsappVendedor: wa }, function (res) {
      b.disabled = false; b.textContent = 'Guardar';
      if (res.ok) { recibirPanel(res); aviso('Datos de contacto guardados.'); }
      else errorEn('c-error', res.error || 'No se pudo guardar.');
    }, function () { b.disabled = false; b.textContent = 'Guardar'; errorEn('c-error', 'No se pudo conectar. Intenta de nuevo.'); });
  }

  function textoLista() {
    return NUMEROS.map(function (n) {
      var f = filaDe(n);
      if (!(f && f.nombre)) return n + ' · disponible';
      return n + ' · ' + f.nombre + (f.celular ? ' · ' + f.celular : '') + ' · ' + (f.pagado ? 'pagado' : 'por cobrar');
    }).join('\n');
  }

  /* =========================================================
     EVENTOS E INICIO
     ========================================================= */
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t.closest) return;
    var b = t.closest('.butaca');
    if (b) { tocarButaca(b.dataset.n); return; }
    var a = t.closest('[data-acc]');
    if (!a) return;
    var num = a.dataset.num;
    switch (a.dataset.acc) {
      case 'cerrar': if (!ocupado) cerrarModal(false); break;
      case 'otro': borrador = leerDatos(); cerrarModal(true); aviso('Toca otro número disponible.'); break;
      case 'quitar-num':
        sel.delete(num);
        if (!sel.size) { cerrarModal(false); break; }
        borrador = leerDatos();
        $('m-resumen').innerHTML = htmlResumen(ordenar(Array.from(sel)), true);
        if (vista === 'publica') renderButacas();
        break;
      case 'continuar': if (sel.size) abrirModal({ tipo: 'datos' }); break;
      case 'limpiar': sel.clear(); borrador = {}; renderButacas(); renderBarra(); break;
      case 'actualizar': cargarPanel(); aviso('Actualizando…'); break;
      case 'mapa':
        if (ocupado) break;
        var f = filaDe(num);
        if (f && f.nombre) abrirModal({ tipo: 'detalle', n: num });
        else { sel.clear(); sel.add(num); borrador = {}; abrirModal({ tipo: 'datos' }); }
        break;
      case 'liberar': modal.confirmar = true; renderModal(); break;
      case 'liberar-no': modal.confirmar = false; renderModal(); break;
      case 'liberar-si': if (!ocupado) liberarNumero(modal.n); break;
      case 'copiar-lista':
        var txt = textoLista();
        copiar(txt, function () {
          var ta = $('v-copia'); ta.value = txt; ta.hidden = false; ta.focus(); ta.select();
          aviso('Copia la lista desde el cuadro de texto.');
        });
        break;
    }
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.dataset && t.dataset.pagado) cambiarPagado(t.dataset.pagado, t.checked, t);
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ocupado) return;
    var id = ev.target.id;
    if (id === 'f-datos') enviarDatos();
    else if (id === 'f-config') guardarContacto();
    else if (id === 'f-clave') {
      var c = $('clave').value.trim();
      if (!c) { errorEn('clave-error', 'Escribe tu clave.'); return; }
      entrar(c, false);
    }
  });

  function iniciar() {
    if (vista === 'panel') {
      document.title = 'Panel del vendedor · Calendario Millonario 2027';
      $('app').innerHTML = FONDO + '<main class="wrap" id="vend"></main>' + COMUNES;
      var guardada = '';
      try { guardada = sessionStorage.getItem('cm2027-clave') || ''; } catch (e) {}
      renderClave('');
      if (guardada) entrar(guardada, true);
      setInterval(function () { if (!document.hidden && !modal) cargarPanel(); }, 30000);
    } else {
      $('app').innerHTML = htmlPublica();
      renderButacas();
      renderBarra();
      cargarEstado(true);
      setInterval(function () { cargarEstado(false); }, 15000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) cargarEstado(false); });
    }
    dlg = $('modal');
    dlg.addEventListener('close', function () {
      if (!modal) return;
      sel.clear(); borrador = {}; modal = null;
      document.documentElement.classList.remove('modal-abierto');
      $('modal-cont').innerHTML = '';
      if (vista === 'publica') { renderButacas(); renderBarra(); }
    });
    dlg.addEventListener('cancel', function (ev) { if (ocupado) ev.preventDefault(); });
    dlg.addEventListener('click', function (ev) { if (ev.target === dlg && !ocupado) cerrarModal(false); });
  }

  iniciar();
})();
</script>
</body>
</html>
